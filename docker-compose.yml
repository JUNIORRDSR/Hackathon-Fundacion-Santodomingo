# Local: docker compose up --build → http://localhost:8000 (los contratos están en /docs).
# Solo la base, para correr el backend o las pruebas fuera de Docker: docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecoconecta
      POSTGRES_USER: ecoconecta
      POSTGRES_PASSWORD: solo-para-desarrollo-local
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoconecta -d ecoconecta"]
      interval: 3s
      retries: 20

  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENTORNO: local
      DATABASE_URL: postgresql+psycopg://ecoconecta:solo-para-desarrollo-local@db:5432/ecoconecta
      CLAVE_SESION: ${CLAVE_SESION:-solo-para-desarrollo-local}
      CLAVE_DEMO: ${CLAVE_DEMO:-ecoconecta-demo}
      SEMBRAR_DEMO: "1"

volumes:
  datos:
