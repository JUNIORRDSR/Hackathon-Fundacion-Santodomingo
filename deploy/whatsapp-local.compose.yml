services:
  app:
    environment:
      NGROK_AUTHTOKEN: ""
      CLOUDFLARE_TUNNEL_TOKEN: ""

  whatsapp-webhook:
    profiles: [ngrok, fijo, temporal]
    image: nginx:1.30-alpine
    volumes:
      - ./deploy/whatsapp-local.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  whatsapp-tunel-ngrok:
    profiles: [ngrok]
    image: ngrok/ngrok:3
    command: ["http", "http://whatsapp-webhook:8080", "--url=https://${NGROK_DOMAIN:-}", "--inspect=false", "--log=stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    depends_on:
      - whatsapp-webhook

  whatsapp-tunel-temporal:
    profiles: [temporal]
    image: cloudflare/cloudflared:2026.7.2
    command: tunnel --no-autoupdate --url http://whatsapp-webhook:8080
    depends_on:
      - whatsapp-webhook

  whatsapp-tunel-fijo:
    profiles: [fijo]
    image: cloudflare/cloudflared:2026.7.2
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - whatsapp-webhook
    restart: unless-stopped
