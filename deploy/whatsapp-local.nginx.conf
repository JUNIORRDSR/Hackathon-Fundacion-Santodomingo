server {
    listen 8080;
    server_name _;
    access_log off;
    client_max_body_size 32k;

    # Compose puede asignar otra IP a FastAPI al recrear el contenedor.
    resolver 127.0.0.11 valid=2s ipv6=off;

    location / {
        return 404;
    }

    # Los carteles que adjunta el bot (ADR-0016): Twilio los descarga por esta URL pública.
    location ~ ^/api/whatsapp/carteles/[a-z-]+\.jpg$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        set $backend http://app:8000;
        proxy_connect_timeout 2s;
        proxy_read_timeout 13s;
        proxy_pass $backend;
    }

    location = /api/whatsapp/twilio {
        if ($request_method != POST) { return 405; }
        set $backend http://app:8000;
        proxy_connect_timeout 2s;
        proxy_read_timeout 13s;
        proxy_pass $backend;
    }
}
